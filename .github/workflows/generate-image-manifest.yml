name: Update Image Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'images/**'
      - 'tools/generate-image-manifest.py'
      - '.github/workflows/generate-image-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate image manifest
        run: python tools/generate-image-manifest.py

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "Auto-update image manifest"
            git push
          fi
