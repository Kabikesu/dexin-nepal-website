name: Update Image Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'images/**'
      - 'tools/generate-image-manifest.py'
      - '.github/workflows/generate-image-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Move legacy Environment Day photos into event folder
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('images/gallery/events')
          target = source / 'Environment Day'
          target.mkdir(parents=True, exist_ok=True)

          legacy = []
          for path in source.iterdir():
              if not path.is_file():
                  continue
              if not re.match(r'^Enviroment Day\s*\(\d+\)\.(jpg|jpeg|png|webp|gif)$', path.name, re.I):
                  continue
              number = int(re.search(r'\((\d+)\)', path.stem).group(1))
              legacy.append((number, path))

          for index, (number, path) in enumerate(sorted(legacy), start=1):
              extension = path.suffix.lower()
              destination = target / f'{index:02d}{extension}'
              if destination.exists():
                  destination.unlink()
              path.rename(destination)

          print(f'Migrated {len(legacy)} legacy Environment Day photos.')
          PY

      - name: One-time delete selected Environment Day photos
        run: |
          for n in 01 05 07 08 09 11 14 15 21 24 26 27 31 40 42 44 45 46 50; do
            rm -f "images/gallery/events/Environment Day/${n}.jpeg"
          done
          echo "Removed requested Environment Day photos."

      - name: Generate image and video manifest
        run: python tools/generate-image-manifest.py

      - name: Commit updated media structure and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/gallery/events images.json
          if git diff --cached --quiet; then
            echo "No media structure or manifest changes."
          else
            git commit -m "Delete selected Environment Day photos"
            git push
          fi
